name = "woori-church"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 주보 파일 최대 크기 (바이트). 기본 10MB
[vars]
MAX_UPLOAD_BYTES = "10485760"
# 개인정보처리방침에 표시될 문의 이메일 — 본인 것으로 바꾸세요
CONTACT_EMAIL = "바꿔주세요@example.com"

[[d1_databases]]
binding = "DB"
database_name = "woori-church"
database_id = "4ec9b3a3-7596-4f0f-b82b-11f718b2a791"

[[r2_buckets]]
binding = "FILES"
bucket_name = "woori-church-files"
